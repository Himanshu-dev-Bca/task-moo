<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0b0d10;
      --card: #13171c;
      --card-hover: #191e24;
      --border: #252b33;
      --text: #f5f7fa;
      --muted: #8b949e;
      --accent: #7c5cff;
      --danger: #ff5c70;
      --success: #45d483;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top right, rgba(124,92,255,.12), transparent 35%),
        var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 50px 20px;
    }

    .app {
      width: 100%;
      max-width: 760px;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    .logo span {
      color: var(--accent);
    }

    .date {
      color: var(--muted);
      font-size: 13px;
    }

    /* Input */
    .add-task {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
    }

    .add-task input {
      flex: 1;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 15px 17px;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
      transition: .2s;
    }

    .add-task input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,92,255,.12);
    }

    button {
      border: none;
      cursor: pointer;
      font: inherit;
    }

    .add-btn {
      background: var(--accent);
      color: white;
      padding: 0 21px;
      border-radius: 12px;
      font-weight: 700;
      transition: .2s;
    }

    .add-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }

    /* Stats */
    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 10px 15px;
      border-radius: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .stat strong {
      color: var(--text);
      margin-right: 4px;
    }

    /* Filters */
    .filters {
      display: flex;
      gap: 7px;
      margin-bottom: 15px;
    }

    .filter {
      background: transparent;
      color: var(--muted);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 13px;
    }

    .filter.active,
    .filter:hover {
      background: var(--card);
      color: var(--text);
    }

    /* Tasks */
    #taskList {
      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 13px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 14px 15px;
      border-radius: 12px;
      transition: .2s;
    }

    .task:hover {
      background: var(--card-hover);
    }

    .checkbox {
      width: 19px;
      height: 19px;
      border: 1.5px solid #555e69;
      border-radius: 6px;
      flex-shrink: 0;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: white;
      font-size: 12px;
    }

    .task.completed .checkbox {
      background: var(--success);
      border-color: var(--success);
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.4;
    }

    .task.completed .task-text {
      color: var(--muted);
      text-decoration: line-through;
    }

    .delete {
      color: var(--muted);
      background: transparent;
      font-size: 18px;
      opacity: 0;
      transition: .2s;
    }

    .task:hover .delete {
      opacity: 1;
    }

    .delete:hover {
      color: var(--danger);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 55px 20px;
      color: var(--muted);
    }

    .empty-icon {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .empty p {
      font-size: 14px;
    }

    /* Footer */
    footer {
      margin-top: 25px;
      color: #59616b;
      font-size: 11px;
      text-align: center;
    }

    kbd {
      background: var(--card);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 10px;
    }

    @media (max-width: 600px) {
      body {
        padding: 30px 15px;
      }

      header {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px;
      }

      .add-task {
        flex-direction: column;
      }

      .add-btn {
        height: 46px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header>
      <div>
        <div class="logo">Task<span>Flow</span></div>
      </div>

      <div class="date" id="date"></div>
    </header>

    <div class="add-task">
      <input
        id="taskInput"
        type="text"
        placeholder="What needs to be done?"
        maxlength="120"
      />
      <button class="add-btn" onclick="addTask()">Add Task</button>
    </div>

    <div class="stats">
      <div class="stat">
        <strong id="total">0</strong> Total
      </div>

      <div class="stat">
        <strong id="remaining">0</strong> Remaining
      </div>

      <div class="stat">
        <strong id="completed">0</strong> Done
      </div>
    </div>

    <div class="filters">
      <button class="filter active" onclick="setFilter('all', this)">
        All
      </button>

      <button class="filter" onclick="setFilter('active', this)">
        Active
      </button>

      <button class="filter" onclick="setFilter('completed', this)">
        Completed
      </button>
    </div>

    <div id="taskList"></div>

    <footer>
      Press <kbd>Enter</kbd> to add a task
    </footer>

  </main>

  <script>
    // -----------------------------
    // State
    // -----------------------------

    let tasks = JSON.parse(localStorage.getItem("taskflow-tasks")) || [];
    let currentFilter = "all";

    // -----------------------------
    // Date
    // -----------------------------

    document.getElementById("date").textContent =
      new Date().toLocaleDateString("en-IN", {
        weekday: "long",
        day: "numeric",
        month: "short"
      });

    // -----------------------------
    // Save
    // -----------------------------

    function saveTasks() {
      localStorage.setItem("taskflow-tasks", JSON.stringify(tasks));
    }

    // -----------------------------
    // Add task
    // -----------------------------

    function addTask() {
      const input = document.getElementById("taskInput");
      const text = input.value.trim();

      if (!text) return;

      tasks.unshift({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = "";

      saveTasks();
      render();

      input.focus();
    }

    // Enter key
    document.getElementById("taskInput").addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        addTask();
      }
    });

    // -----------------------------
    // Toggle task
    // -----------------------------

    function toggleTask(id) {
      tasks = tasks.map(task =>
        task.id === id
          ? { ...task, completed: !task.completed }
          : task
      );

      saveTasks();
      render();
    }

    // -----------------------------
    // Delete task
    // -----------------------------

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);

      saveTasks();
      render();
    }

    // -----------------------------
    // Filter
    // -----------------------------

    function setFilter(filter, button) {
      currentFilter = filter;

      document.querySelectorAll(".filter").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");

      render();
    }

    // -----------------------------
    // Render
    // -----------------------------

    function render() {
      const list = document.getElementById("taskList");

      let filteredTasks = tasks;

      if (currentFilter === "active") {
        filteredTasks = tasks.filter(task => !task.completed);
      }

      if (currentFilter === "completed") {
        filteredTasks = tasks.filter(task => task.completed);
      }

      if (filteredTasks.length === 0) {
        list.innerHTML = `
          <div class="empty">
            <div class="empty-icon">✓</div>
            <p>
              ${
                currentFilter === "completed"
                  ? "No completed tasks yet."
                  : currentFilter === "active"
                  ? "You're all caught up."
                  : "Nothing here yet. Add your first task."
              }
            </p>
          </div>
        `;
      } else {
        list.innerHTML = filteredTasks.map(task => `
          <div class="task ${task.completed ? "completed" : ""}">

            <div
              class="checkbox"
              onclick="toggleTask(${task.id})"
            >
              ${task.completed ? "✓" : ""}
            </div>

            <div class="task-text">
              ${escapeHTML(task.text)}
            </div>

            <button
              class="delete"
              onclick="deleteTask(${task.id})"
              title="Delete task"
            >
              ×
            </button>

          </div>
        `).join("");
      }

      // Stats
      const completedCount = tasks.filter(task => task.completed).length;

      document.getElementById("total").textContent = tasks.length;
      document.getElementById("completed").textContent = completedCount;
      document.getElementById("remaining").textContent =
        tasks.length - completedCount;
    }

    // -----------------------------
    // Prevent HTML injection
    // -----------------------------

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Initial render
    render();
  </script>

</body>
</html>
